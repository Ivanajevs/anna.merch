<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – St. Anna Merch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    /* ── CSS-Variablen (passend zu style.css) ───────────────────── */
    :root {
      --bg:        #fce7e7;
      --bg2:       #f8aaaa;
      --bg3:       #f58b8b;
      --gold:      #fd0000;
      --gold-dim:  #d44013;
      --text:      #000000;
      --text-muted:#880000;
      --radius:    10px;
      --green:     #22c55e;
      --red:       #ef4444;
      --border:    rgba(232,160,32,.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .logo-sub {
      font-size: .75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .admin-badge {
      margin-left: auto;
      font-size: .7rem;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      padding: .25rem .7rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    #logoutBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      padding: .4rem .9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    #logoutBtn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Login Screen ────────────────────────────────────────────── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 70px);
      padding: 2rem;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .login-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .login-card label {
      font-size: .78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      display: block;
      margin-bottom: .4rem;
    }
    .login-card input {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--gold); }
    .login-error {
      font-size: .83rem;
      color: var(--red);
      min-height: 1.2rem;
    }
    .btn-login {
      width: 100%;
      padding: .8rem;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-login:hover { background: var(--gold-dim); }

    /* ── Dashboard ───────────────────────────────────────────────── */
    #dashboard {
      display: none;
      padding: 2rem;
    }
    .dash-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .order-count {
      font-size: .8rem;
      color: var(--text-muted);
    }
    .btn-refresh {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      padding: .4rem .9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Tabelle ─────────────────────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      background: var(--bg3);
      color: var(--text-muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 600;
      padding: .85rem 1.1rem;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid rgba(232,160,32,.07);
      transition: background .15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(232,160,32,.04); }
    tbody td {
      padding: .85rem 1.1rem;
      vertical-align: middle;
      white-space: nowrap;
    }
    .order-id-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0;
    }
    .order-id-btn:hover { color: var(--gold-dim); }

    /* ── Status-Badges (klickbar) ────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .3rem .8rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: opacity .2s, transform .1s;
      user-select: none;
    }
    .status-badge:hover { opacity: .85; }
    .status-badge:active { transform: scale(.95); }
    .status-badge.on  { background: rgba(34,197,94,.15);  color: var(--green); }
    .status-badge.off { background: rgba(239,68,68,.12);  color: var(--red);   }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .date-cell { color: var(--text-muted); font-size: .8rem; }

    /* ── Loading / Empty ─────────────────────────────────────────── */
    .table-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: .9rem;
    }

    /* ── Detail Modal ────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .detail-modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .detail-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: .9rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .detail-close:hover { border-color: var(--gold); color: var(--gold); }
    .detail-modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: .04em;
      margin-bottom: 1.5rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .8rem 1.5rem;
    }
    .detail-item { display: flex; flex-direction: column; gap: .2rem; }
    .detail-label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--text-muted);
    }
    .detail-value {
      font-size: .92rem;
      color: var(--text);
      font-weight: 600;
      word-break: break-word;
    }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid var(--border);
      margin: .4rem 0;
    }

    @media (max-width: 600px) {
      .detail-grid { grid-template-columns: 1fr; }
      #dashboard { padding: 1rem; }
    }

    /* ── Bestätigungs-Modal ──────────────────────────────────────── */
    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 1rem;
    }
    .confirm-overlay.active { display: flex; }
    .confirm-modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      animation: slideUp .2s ease;
    }
    .confirm-modal h4 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: var(--gold);
      letter-spacing: .04em;
      margin-bottom: 1rem;
    }
    .confirm-info {
      background: var(--bg3);
      border-radius: var(--radius);
      padding: .9rem 1.1rem;
      font-size: .88rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
      color: var(--text);
    }
    .confirm-info strong { color: var(--gold); }
    .confirm-note {
      font-size: .78rem;
      color: var(--text-muted);
      margin-bottom: 1.4rem;
    }
    .confirm-actions {
      display: flex;
      gap: .75rem;
      justify-content: flex-end;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      padding: .55rem 1.1rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-cancel:hover { border-color: var(--red); color: var(--red); }
    .btn-confirm {
      background: var(--gold);
      border: none;
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: .06em;
      padding: .55rem 1.3rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .2s;
      display: flex; align-items: center; gap: .5rem;
    }
    .btn-confirm:hover { background: var(--gold-dim); }
    .btn-confirm:disabled { opacity: .5; cursor: not-allowed; }
    .spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-badge.pending {
      opacity: .5;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo-main">St. Anna</div>
      <div class="logo-sub">Merch Shop</div>
    </div>
    <span class="admin-badge">Admin</span>
    <button id="logoutBtn" hidden>Abmelden</button>
  </header>

  <!-- ══════════════  LOGIN  ══════════════ -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Admin-Login</h2>
      <div>
        <label for="loginUser">Benutzername</label>
        <input type="text" id="loginUser" autocomplete="username" placeholder="admin" />
      </div>
      <div>
        <label for="loginPass">Passwort</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <p class="login-error" id="loginError"></p>
      <button class="btn-login" id="loginBtn">Anmelden</button>
    </div>
  </div>

  <!-- ══════════════  DASHBOARD  ══════════════ -->
  <div id="dashboard">
    <div class="dash-header">
      <h1>Bestellungen</h1>
      <span class="order-count" id="orderCount"></span>
      <button class="btn-refresh" id="refreshBtn">↻ Aktualisieren</button>
    </div>

    <div class="table-wrap">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Bestell-ID</th>
            <th>Produkt</th>
            <th>Kunde</th>
            <th>Bezahlt</th>
            <th>Bestellt</th>
            <th>Ausgeliefert</th>
            <th>Datum</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="7" class="table-state">Lade Bestellungen…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ══════════════  DETAIL MODAL  ══════════════ -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="detail-close" id="detailClose" aria-label="Schließen">✕</button>
      <h3 id="detailTitle">Bestellung</h3>
      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </div>

  <!-- ══════════════  BESTÄTIGUNGS-MODAL  ══════════════ -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h4 id="confirmTitle">Status ändern</h4>
      <div class="confirm-info" id="confirmInfo"></div>
      <p class="confirm-note" id="confirmNote"></p>
      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmCancel">Abbrechen</button>
        <button class="btn-confirm" id="confirmOk">
          <span id="confirmLabel">Bestätigen &amp; E-Mail senden</span>
          <span id="confirmSpinner" class="spin" hidden></span>
        </button>
      </div>
    </div>
  </div>

  <script>
  /* ══════════════════════════════════════════════════════════════════
     KONFIGURATION
  ════════════════════════════════════════════════════════════════════ */
  const SUPABASE_URL      = "https://daidxdpsyncqedsixvwm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_wm01ffHn7eXfeJaAiXrGdA_b-VJntmy";

  // ▶ Derselbe Cloudflare-Worker wie in script.js
  const BREVO_WORKER_URL      = "https://anna-merch-mailer.st-anna-merch.workers.dev";
  // ▶ Template-ID für Statusänderungs-E-Mails (neu anlegen – siehe Anleitung)
  const BREVO_STATUS_TEMPLATE = 5;
  const ADMIN_EMAIL           = "bestellung@merch.st-anna.de";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ADMIN_USER = "admin";
  const ADMIN_PASS = "M1e2r3c4h5!";

  let isLoggedIn = false;

  /* ══════════  BREVO E-MAIL HELPER  ════════════════════════════════ */
  async function sendBrevoEmail(toEmail, toName, templateId, params) {
    const response = await fetch(BREVO_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        to: [{ email: toEmail, name: toName }],
        templateId,
        params,
        replyTo: { email: ADMIN_EMAIL },
      }),
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(`Brevo ${response.status}: ${err.message || response.statusText}`);
    }
    return response.json();
  }

  /* ══════════  STATUS-LABELS  ════════════════════════════════════════ */
  const FIELD_LABELS = {
    paid:      "Bezahlt",
    ordered:   "Bestellt",
    delivered: "Ausgeliefert",
  };

  /* ══════════  LOGIN  ════════════════════════════════════════════════ */
  function attemptLogin() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;
    const err  = document.getElementById("loginError");

    if (user === ADMIN_USER && pass === ADMIN_PASS) {
      isLoggedIn = true;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display   = "block";
      document.getElementById("logoutBtn").hidden = false;
      loadOrders();
    } else {
      err.textContent = "Falscher Benutzername oder falsches Passwort.";
      document.getElementById("loginPass").value = "";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", attemptLogin);
  document.getElementById("loginPass").addEventListener("keydown", e => {
    if (e.key === "Enter") attemptLogin();
  });
  document.getElementById("loginUser").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loginPass").focus();
  });

  /* ── Logout ────────────────────────────────────────────────────── */
  document.getElementById("logoutBtn").addEventListener("click", () => {
    isLoggedIn = false;
    document.getElementById("loginScreen").style.display = "";
    document.getElementById("dashboard").style.display   = "none";
    document.getElementById("logoutBtn").hidden = true;
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    document.getElementById("loginError").textContent = "";
  });

  /* ══════════  BESTELLUNGEN LADEN  ══════════════════════════════════ */
  async function loadOrders() {
    const tbody = document.getElementById("ordersBody");
    tbody.innerHTML = `<tr><td colspan="7" class="table-state">Lade Bestellungen…</td></tr>`;

    const { data, error } = await db
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-state" style="color:var(--red)">
        Fehler beim Laden: ${error.message}</td></tr>`;
      return;
    }

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-state">Noch keine Bestellungen vorhanden.</td></tr>`;
      document.getElementById("orderCount").textContent = "";
      return;
    }

    document.getElementById("orderCount").textContent =
      `${data.length} Bestellung${data.length !== 1 ? "en" : ""}`;
    tbody.innerHTML = "";

    data.forEach(order => {
      const tr = document.createElement("tr");
      const dateStr = order.created_at
        ? new Date(order.created_at).toLocaleString("de-DE", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          })
        : "—";

      tr.innerHTML = `
        <td>
          <button class="order-id-btn" data-id="${order.id}">
            ${order.order_id || order.id.substring(0, 8) + "…"}
          </button>
        </td>
        <td>${order.product_name || "—"}</td>
        <td>${order.customer_name || "—"}</td>
        <td>${statusBadge("paid",      order.id, order.paid)}</td>
        <td>${statusBadge("ordered",   order.id, order.ordered)}</td>
        <td>${statusBadge("delivered", order.id, order.delivered)}</td>
        <td class="date-cell">${dateStr}</td>
      `;

      tr.querySelector(".order-id-btn").addEventListener("click", () => openDetail(order));

      tr.querySelectorAll(".status-badge").forEach(badge => {
        badge.addEventListener("click", () => openConfirm(badge, order));
      });

      tbody.appendChild(tr);
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", loadOrders);

  /* ══════════  STATUS-BADGE HTML  ════════════════════════════════════ */
  function statusBadge(field, orderId, value) {
    const on = !!value;
    return `<button class="status-badge ${on ? "on" : "off"}"
               data-field="${field}" data-order-id="${orderId}">
               <span class="status-dot"></span>
               ${on ? "Ja" : "Nein"}
            </button>`;
  }

  /* ══════════  BESTÄTIGUNGS-MODAL  ══════════════════════════════════ */
  let _pendingBadge = null;
  let _pendingOrder = null;
  let _pendingNewValue = null;

  function openConfirm(badge, order) {
    const field     = badge.dataset.field;
    const newValue  = badge.classList.contains("on") ? false : true;
    const label     = FIELD_LABELS[field] || field;
    const valueText = newValue ? "✓ JA" : "✗ NEIN";
    const email     = order.customer_email || "—";
    const name      = order.customer_name  || "Kunde";

    _pendingBadge    = badge;
    _pendingOrder    = order;
    _pendingNewValue = newValue;

    document.getElementById("confirmInfo").innerHTML =
      `Status <strong>${label}</strong> für <strong>${name}</strong> wird auf <strong>${valueText}</strong> gesetzt.`;

    document.getElementById("confirmNote").textContent =
      `Es wird automatisch eine E-Mail an ${email} gesendet.`;

    document.getElementById("confirmLabel").textContent = "Bestätigen & E-Mail senden";
    document.getElementById("confirmSpinner").hidden    = true;
    document.getElementById("confirmOk").disabled       = false;

    document.getElementById("confirmOverlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeConfirm() {
    document.getElementById("confirmOverlay").classList.remove("active");
    document.body.style.overflow = "";
    _pendingBadge    = null;
    _pendingOrder    = null;
    _pendingNewValue = null;
  }

  document.getElementById("confirmCancel").addEventListener("click", closeConfirm);
  document.getElementById("confirmOverlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeConfirm();
  });

  document.getElementById("confirmOk").addEventListener("click", async () => {
    if (!_pendingBadge) return;

    const badge    = _pendingBadge;
    const order    = _pendingOrder;
    const newValue = _pendingNewValue;
    const field    = badge.dataset.field;

    // Spinner zeigen
    document.getElementById("confirmLabel").textContent = "Wird gespeichert…";
    document.getElementById("confirmSpinner").hidden    = false;
    document.getElementById("confirmOk").disabled       = true;
    badge.classList.add("pending");

    try {
      // 1. Supabase aktualisieren
      const { error: dbError } = await db
        .from("orders")
        .update({ [field]: newValue })
        .eq("id", order.id);

      if (dbError) throw new Error("Supabase: " + dbError.message);

      // 2. E-Mail an Besteller senden
      const statusLabel = FIELD_LABELS[field] || field;
      await sendBrevoEmail(
        order.customer_email,
        order.customer_name,
        BREVO_STATUS_TEMPLATE,
        {
          customer_name:  order.customer_name  || "—",
          customer_email: order.customer_email || "—",
          order_id:       order.order_id       || "—",
          product_name:   order.product_name   || "—",
          product_price:  order.product_price  || "—",
          size:           order.size           || "—",
          color:          order.color          || "—",
          status_field:   statusLabel,
          status_value:   newValue ? "Ja" : "Nein",
          status_emoji:   newValue ? "✅" : "❌",
          order_date:     order.created_at
            ? new Date(order.created_at).toLocaleDateString("de-DE")
            : "—",
        }
      );

      // 3. Badge im UI aktualisieren
      badge.classList.remove("pending");
      badge.classList.toggle("on",  newValue);
      badge.classList.toggle("off", !newValue);
      badge.innerHTML = `<span class="status-dot"></span>${newValue ? "Ja" : "Nein"}`;

      // 4. Order-Objekt lokal aktualisieren
      order[field] = newValue;

      closeConfirm();

    } catch (err) {
      console.error("Fehler:", err);
      badge.classList.remove("pending");
      document.getElementById("confirmLabel").textContent = "Bestätigen & E-Mail senden";
      document.getElementById("confirmSpinner").hidden    = true;
      document.getElementById("confirmOk").disabled       = false;
      document.getElementById("confirmInfo").innerHTML +=
        `<br><span style="color:var(--red);font-size:.8rem">⚠ Fehler: ${err.message}</span>`;
    }
  });

  /* ══════════  DETAIL MODAL  ═════════════════════════════════════════ */
  function openDetail(order) {
    document.getElementById("detailTitle").textContent =
      `Bestellung ${order.order_id || "—"}`;

    const grid = document.getElementById("detailGrid");
    const rows = [
      { label: "Bestell-ID",       value: order.order_id || "—" },
      { label: "Datum",            value: order.created_at
          ? new Date(order.created_at).toLocaleString("de-DE")
          : "—" },
      { label: "divider" },
      { label: "Produkt",          value: order.product_name   || "—" },
      { label: "Preis",            value: order.product_price  || "—" },
      { label: "Größe",            value: order.size           || "—" },
      { label: "Farbe",            value: order.color          || "—" },
      { label: "Geschlecht",       value: order.gender         || "—" },
      { label: "Klasse",           value: `${order.class_level || ""}${order.class_letter || ""}` || "—" },
      { label: "divider" },
      { label: "Name",             value: order.customer_name  || "—" },
      { label: "E-Mail",           value: order.customer_email || "—", full: true },
      { label: "Anmerkung",        value: order.note           || "—", full: true },
      { label: "divider" },
      { label: "Bezahlt",          value: order.paid      ? "✓ Ja" : "✗ Nein" },
      { label: "Bestellt",         value: order.ordered   ? "✓ Ja" : "✗ Nein" },
      { label: "Ausgeliefert",     value: order.delivered ? "✓ Ja" : "✗ Nein" },
    ];

    grid.innerHTML = rows.map(r => {
      if (r.label === "divider") return `<hr class="detail-divider" />`;
      return `
        <div class="detail-item${r.full ? " full" : ""}">
          <span class="detail-label">${r.label}</span>
          <span class="detail-value">${r.value}</span>
        </div>`;
    }).join("");

    document.getElementById("detailOverlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeDetail() {
    document.getElementById("detailOverlay").classList.remove("active");
    document.body.style.overflow = "";
  }

  document.getElementById("detailClose").addEventListener("click", closeDetail);
  document.getElementById("detailOverlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeDetail();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeDetail(); closeConfirm(); }
  });
  </script>
</body>
</html>
